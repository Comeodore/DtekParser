<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="color-scheme" content="dark light">
    <title>DTEK Status</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=8.0"></script>
    <style>
        :root {
            --app-bg: var(--tg-theme-bg-color, #1c1c1e);
            --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --text-primary: var(--tg-theme-text-color, #fff);
            --text-secondary: var(--tg-theme-hint-color, #98989f);
            --accent: var(--tg-theme-button-color, #0a84ff);
            --accent-text: var(--tg-theme-button-text-color, #fff);
            --divider: rgba(84, 84, 88, 0.35);
            --status-on: #30d158;
            --status-off: #ff453a;
            --power-on: #5ab56a;
            --power-off: #d06058;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --transition: 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--app-bg);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            padding: var(--spacing-lg);
            padding-bottom: calc(var(--spacing-lg) + env(safe-area-inset-bottom, 0));
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .status-badge.on {
            background: rgba(48, 209, 88, 0.15);
            color: var(--status-on);
        }

        .status-badge.off {
            background: rgba(255, 69, 58, 0.15);
            color: var(--status-off);
        }

        .status-badge.emergency {
            background: rgba(255, 69, 58, 0.2);
            color: var(--status-off);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-row {
            display: flex;
            justify-content: center;
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--divider);
        }

        .status-row.hidden { display: none; }

        .info-list {
            display: flex;
            flex-direction: column;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid var(--divider);
        }

        .info-row:last-child { border-bottom: none; }

        .info-label {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
        }

        .info-value {
            font-size: 15px;
            font-weight: 500;
            text-align: right;
        }

        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--divider);
            margin-bottom: var(--spacing-md);
        }

        .schedule-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .schedule-date {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
        }

        .hour {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .hour.on { background: var(--power-on); color: #fff; }
        .hour.off { background: var(--power-off); color: #fff; }
        .hour.half-first { background: linear-gradient(180deg, var(--power-off) 50%, var(--power-on) 50%); color: #fff; }
        .hour.half-second { background: linear-gradient(180deg, var(--power-on) 50%, var(--power-off) 50%); color: #fff; }

        .hour.current {
            transform: scale(1.1);
            box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .schedule-footer {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--divider);
        }

        .stats {
            display: flex;
            justify-content: space-around;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-value.on { color: var(--power-on); }
        .stat-value.off { color: var(--power-off); }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: var(--spacing-lg) 0;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: calc(80px + env(safe-area-inset-bottom, 0));
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            color: #fff;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: rgba(48, 209, 88, 0.9); }
        .toast.error { background: rgba(255, 69, 58, 0.9); }

        .skeleton {
            background: linear-gradient(90deg, var(--divider) 25%, transparent 50%, var(--divider) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .status-badge.planned {
            background: rgba(255, 159, 10, 0.15);
            color: #ff9f0a;
        }

        .notice {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-primary);
            border-left: 3px solid #ff9f0a;
        }

        .notice.muted {
            color: var(--text-secondary);
            border-left-color: var(--divider);
        }

        .line-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: var(--spacing-md) 0 var(--spacing-sm);
        }

        .line-title:first-child { margin-top: 0; }

        #days {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="statusCard">
            <div class="status-row" id="statusRow">
                <div class="status-badge" id="statusBadge">
                    <span class="status-indicator"></span>
                    <span id="statusText"></span>
                </div>
            </div>
            <div class="info-list">
                <div class="info-row hidden" id="reasonRow">
                    <span class="info-label" data-i18n="reason"></span>
                    <span class="info-value" id="reasonText">-</span>
                </div>
                <div class="info-row hidden" id="startRow">
                    <span class="info-label" data-i18n="start"></span>
                    <span class="info-value" id="startTime">-</span>
                </div>
                <div class="info-row hidden" id="restorationRow">
                    <span class="info-label" data-i18n="restoration"></span>
                    <span class="info-value" id="restorationTime">-</span>
                </div>
                <div class="info-row" id="updatedRow">
                    <span class="info-label" data-i18n="lastUpdated"></span>
                    <span class="info-value" id="updatedTime">-</span>
                </div>
            </div>
        </div>

        <div class="card notice hidden" id="noticeCard"></div>
        <div class="card notice muted hidden" id="staleCard"></div>

        <div class="card hidden" id="noScheduleCard">
            <div class="empty-state" data-i18n="noSchedule"></div>
        </div>

        <div id="days"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (() => {
        'use strict';

        const API_ENDPOINT = '/api/v1/schedule';
        const REFRESH_INTERVAL = 10000;

        const $ = id => document.getElementById(id);

        const i18n = {
            en: {
                loading: 'Loading...',
                error: 'Error',
                emergencyOutage: 'Emergency outage',
                plannedOutage: 'Planned outage',
                otherOutage: 'Outage',
                powerOn: 'Power on',
                reason: 'Reason',
                start: 'Start',
                restoration: 'Restoration',
                lastUpdated: 'Last updated',
                today: '📅 Today',
                tomorrow: '📅 Tomorrow',
                line: 'Line',
                power: 'Power',
                outages: 'Outages',
                noSchedule: 'Schedule not published',
                suspended: '⚠️ Hourly schedules don\'t apply right now, the restoration time may change.',
                multiLine: 'The house is fed by two lines; DTEK doesn\'t know which one feeds a given flat.',
                noGroup: 'DTEK has no schedule group for this address.',
                voluntary: 'Ask the building management for the outage schedule.',
                otherOperator: 'Power at this address is managed by another operator.',
                stale: 'Data may be outdated, last successful update',
                updated: '✅ Updated',
                loadError: '⚠️ Load error'
            },
            uk: {
                loading: 'Завантаження...',
                error: 'Помилка',
                emergencyOutage: 'Аварійне відключення',
                plannedOutage: 'Планове відключення',
                otherOutage: 'Відключення',
                powerOn: 'Світло є',
                reason: 'Причина',
                start: 'Початок',
                restoration: 'Відновлення',
                lastUpdated: 'Дані ДТЕК від',
                today: '📅 Сьогодні',
                tomorrow: '📅 Завтра',
                line: 'Лінія',
                power: 'Зі світлом',
                outages: 'Відключення',
                noSchedule: 'Графік не опубліковано',
                suspended: '⚠️ Графіки погодинних відключень зараз не діють, час відновлення може змінюватися.',
                multiLine: 'Будинок живлять дві лінії, ДТЕК не знає, яка саме живить конкретну квартиру.',
                noGroup: 'Для цієї адреси у ДТЕК немає черги відключень.',
                voluntary: 'Графік відключень уточнюйте в ОСББ/ЖЕК/керуючій компанії.',
                otherOperator: 'Електропостачання за цією адресою забезпечує інша компанія.',
                stale: 'Дані можуть бути застарілими, останнє оновлення',
                updated: '✅ Оновлено',
                loadError: '⚠️ Помилка'
            }
        };

        const state = {
            tg: window.Telegram?.WebApp,
            lang: 'en',
            prevVersion: null,
            isFirst: true
        };

        const t = key => i18n[state.lang]?.[key] ?? i18n.en[key] ?? key;

        const formatDuration = mins => {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            const suffix = state.lang === 'uk' ? ['г', 'хв'] : ['h', 'm'];
            return m ? `${h}${suffix[0]} ${m}${suffix[1]}` : `${h}${suffix[0]}`;
        };

        const showToast = (msg, type) => {
            const el = $('toast');
            el.textContent = msg;
            el.className = `toast ${type} show`;
            setTimeout(() => el.classList.remove('show'), 2500);
        };

        const haptic = type => {
            try { state.tg?.HapticFeedback?.notificationOccurred(type); } catch {}
        };

        const el = (tag, cls, text) => {
            const node = document.createElement(tag);
            if (cls) node.className = cls;
            if (text !== undefined) node.textContent = text;
            return node;
        };

        const updateLabels = () => {
            document.querySelectorAll('[data-i18n]').forEach(node => {
                node.textContent = t(node.dataset.i18n);
            });
        };

        const STATUS_CLASS = {
            power_on: 'on',
            power_off: 'off',
            power_off_first_30: 'half-first',
            power_off_second_30: 'half-second'
        };

        const renderGrid = (slots, isToday) => {
            const grid = el('div', 'schedule-grid');
            const hour = new Date().getHours();
            slots.forEach((status, h) => {
                const current = isToday && h === hour ? ' current' : '';
                grid.appendChild(el('div', `hour ${STATUS_CLASS[status] || 'on'}${current}`, String(h)));
            });
            return grid;
        };

        const renderStats = slots => {
            let on = 0, off = 0;
            slots.forEach(s => {
                if (s === 'power_on') on += 60;
                else if (s === 'power_off') off += 60;
                else { on += 30; off += 30; }
            });
            const footer = el('div', 'schedule-footer');
            const stats = el('div', 'stats');
            [[on, 'on', 'power'], [off, 'off', 'outages']].forEach(([mins, cls, label]) => {
                const stat = el('div', 'stat');
                stat.appendChild(el('div', `stat-value ${cls}`, formatDuration(mins)));
                stat.appendChild(el('div', 'stat-label', t(label)));
                stats.appendChild(stat);
            });
            footer.appendChild(stats);
            return footer;
        };

        const renderDay = day => {
            const card = el('div', 'card');
            const header = el('div', 'schedule-header');
            header.appendChild(el('span', 'schedule-title', t(day.is_today ? 'today' : 'tomorrow')));
            header.appendChild(el('span', 'schedule-date', day.label));
            card.appendChild(header);

            const hasOutages = day.lines.some(line => line.slots.some(s => s !== 'power_on'));
            // A tomorrow without outages is how DTEK shows "not published yet".
            if (!hasOutages && !day.is_today) {
                card.appendChild(el('div', 'empty-state', t('noSchedule')));
                return card;
            }
            const multi = day.lines.length > 1;
            day.lines.forEach((line, i) => {
                if (multi) card.appendChild(el('div', 'line-title', `${t('line')} ${i + 1} · ${line.name}`));
                card.appendChild(renderGrid(line.slots, day.is_today));
                if (!multi) card.appendChild(renderStats(line.slots));
            });
            return card;
        };

        const renderStatus = (outage, updated) => {
            const badge = $('statusBadge');
            const kind = outage ? outage.kind : null;
            const badgeClass = { emergency: 'emergency', planned: 'planned', other: 'off' }[kind] || 'on';
            const label = { emergency: 'emergencyOutage', planned: 'plannedOutage', other: 'otherOutage' }[kind] || 'powerOn';
            badge.className = `status-badge ${badgeClass}`;
            $('statusText').textContent = t(label);
            $('statusRow').classList.remove('hidden');

            const detail = (rowId, valueId, value) => {
                $(rowId).classList.toggle('hidden', !value);
                if (value) $(valueId).textContent = value;
            };
            detail('reasonRow', 'reasonText', outage && outage.reason);
            detail('startRow', 'startTime', outage && outage.start);
            detail('restorationRow', 'restorationTime', outage && outage.end);
            $('updatedTime').textContent = updated || '-';
        };

        const renderNotices = data => {
            const notes = [];
            if (data.schedules_suspended) notes.push(t('suspended'));
            const availability = { no_group: 'noGroup', voluntary: 'voluntary', cek: 'otherOperator' }[data.availability];
            if (availability) notes.push(t(availability));
            if ((data.days || []).some(d => d.lines.length > 1)) notes.push(t('multiLine'));
            $('noticeCard').textContent = notes.join(' ');
            $('noticeCard').classList.toggle('hidden', !notes.length);

            const stale = !data.healthy && data.updated_at;
            if (stale) {
                const when = new Date(data.updated_at).toLocaleString(state.lang === 'uk' ? 'uk-UA' : 'en-GB',
                    { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
                $('staleCard').textContent = `${t('stale')}: ${when}`;
            }
            $('staleCard').classList.toggle('hidden', !stale);
        };

        const fetchData = async () => {
            try {
                const res = await fetch(`${API_ENDPOINT}?_t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                state.lang = data.lang || 'en';
                document.documentElement.lang = state.lang;
                updateLabels();

                const version = `${data.outage_updated}|${data.schedule_updated}|${JSON.stringify(data.outage)}`;
                const changed = state.prevVersion !== null && state.prevVersion !== version;
                state.prevVersion = version;

                renderStatus(data.outage, data.outage_updated);
                renderNotices(data);

                const days = $('days');
                days.replaceChildren(...(data.days || []).map(renderDay));
                $('noScheduleCard').classList.toggle('hidden', (data.days || []).length > 0 || data.schedules_suspended);

                if (!state.isFirst && changed) {
                    showToast(t('updated'), 'success');
                    haptic('success');
                }
                state.isFirst = false;
            } catch (err) {
                console.error('Fetch error:', err);
                showToast(t('loadError'), 'error');
                haptic('error');
                if (state.isFirst) {
                    $('statusRow').classList.remove('hidden');
                    $('statusText').textContent = t('error');
                }
            }
        };

        const init = () => {
            if (state.tg) {
                state.tg.ready();
                state.tg.expand();
                state.tg.setHeaderColor?.('secondary_bg_color');
                state.tg.setBackgroundColor?.('secondary_bg_color');
            }
            updateLabels();
            $('statusText').textContent = t('loading');
            fetchData();
            setInterval(fetchData, REFRESH_INTERVAL);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
