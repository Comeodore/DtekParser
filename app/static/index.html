<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="color-scheme" content="dark light">
    <title>DTEK Status</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=8.0"></script>
    <style>
        :root {
            --app-bg: var(--tg-theme-bg-color, #1c1c1e);
            --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --text-primary: var(--tg-theme-text-color, #fff);
            --text-secondary: var(--tg-theme-hint-color, #98989f);
            --accent: var(--tg-theme-button-color, #0a84ff);
            --accent-text: var(--tg-theme-button-text-color, #fff);
            --divider: rgba(84, 84, 88, 0.35);
            --status-on: #30d158;
            --status-off: #ff453a;
            --power-on: #5ab56a;
            --power-off: #d06058;
            /* Coloured text and chips; Telegram's light theme overrides some (html.light below). */
            --badge-on: var(--status-on);
            --power-title-on: var(--status-on);
            --text-on: var(--power-on);
            --text-off: var(--status-off);
            --stat-off: var(--power-off);
            --text-sun: #ffd60a;
            --text-night: #9a98ff;
            --text-warn: #ff9f0a;
            --hub-node-bg: rgba(127, 127, 127, 0.14);
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --transition: 0.2s ease;
        }

        /* Bright yellow vanishes on Telegram's light greys; a deeper gold keeps it yellow but visible. */
        html.light {
            --text-sun: #c99700;
            --text-night: #5856d6;
            /* The headline's green is large text on a green tint: the bright one washes out on white. */
            --power-title-on: #248a3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--app-bg);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            padding: var(--spacing-lg);
            padding-bottom: calc(var(--spacing-lg) + env(safe-area-inset-bottom, 0));
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card.no-anim { animation: none; }

        /* Schedule updates: a new day fades in where it stands, changed hours flash; nothing moves. */
        .card.fade-in { animation: fadeOnly 0.4s ease; }
        @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
        .hour.changed { animation: cellFlash 1.6s ease-out; }
        @keyframes cellFlash {
            from { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95); }
            to { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .status-badge.on {
            background: rgba(48, 209, 88, 0.15);
            color: var(--badge-on);
        }

        .status-badge.off {
            background: rgba(255, 69, 58, 0.15);
            color: var(--text-off);
        }

        .status-badge.emergency {
            background: rgba(255, 69, 58, 0.2);
            color: var(--text-off);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-row {
            display: flex;
            justify-content: center;
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--divider);
        }

        .status-row.hidden { display: none; }

        /* The power really there, by the source's own sensor, as the headline; since when and what DTEK expects
           under it in the same cell, a tag next to it when the two differ. Without a live sensor the badge above
           shows DTEK's status alone. */
        .power { width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .power-now { width: 100%; padding: var(--spacing-md); border-radius: var(--radius-md); }
        .power.on .power-now { background: rgba(48, 209, 88, 0.14); }
        .power.off .power-now { background: rgba(255, 69, 58, 0.14); }
        .power-head { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 10px; }
        .power-title {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .power-title .status-indicator { width: 10px; height: 10px; }
        .power.on .power-title { color: var(--power-title-on); }
        .power.off .power-title { color: var(--text-off); }
        .power-since {
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-secondary);
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
            text-wrap: balance;
        }
        .power-tag {
            padding: 1px 8px;
            border: 1px solid currentColor;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .power.on .power-tag { color: var(--power-title-on); }
        .power.off .power-tag { color: var(--text-off); }

        .info-list {
            display: flex;
            flex-direction: column;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid var(--divider);
        }

        .info-row:last-child { border-bottom: none; }

        .info-label {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
        }

        .info-value {
            font-size: 15px;
            font-weight: 500;
            text-align: right;
        }

        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--divider);
            margin-bottom: var(--spacing-md);
        }

        .schedule-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .schedule-date {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
        }

        .hour {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .hour.on { background: var(--power-on); color: #fff; }
        .hour.off { background: var(--power-off); color: #fff; }
        .hour.half-first { background: linear-gradient(180deg, var(--power-off) 50%, var(--power-on) 50%); color: #fff; }
        .hour.half-second { background: linear-gradient(180deg, var(--power-on) 50%, var(--power-off) 50%); color: #fff; }

        .hour.current {
            transform: scale(1.1);
            box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .schedule-footer {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--divider);
        }

        .stats {
            display: flex;
            justify-content: space-around;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-value.on { color: var(--text-on); }
        .stat-value.off { color: var(--stat-off); }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: var(--spacing-lg) 0;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: calc(80px + env(safe-area-inset-bottom, 0));
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            color: #fff;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error { background: rgba(255, 69, 58, 0.9); }

        .skeleton {
            background: linear-gradient(90deg, var(--divider) 25%, transparent 50%, var(--divider) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .status-badge.planned {
            background: rgba(255, 159, 10, 0.15);
            color: var(--text-warn);
        }

        .notice {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-primary);
            border-left: 3px solid #ff9f0a;
        }

        .notice.muted {
            color: var(--text-secondary);
            border-left-color: var(--divider);
        }

        .line-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: var(--spacing-md) 0 var(--spacing-sm);
        }

        .line-title:first-child { margin-top: 0; }

        #days {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .inverter {
            margin-top: var(--spacing-sm);
            background: rgba(127, 127, 127, 0.12);
            border-radius: var(--radius-md);
            padding: var(--spacing-md) 10px 10px;
        }

        .inverter-value {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .inverter-value svg { width: 14px; height: 14px; flex: none; }

        .inverter-label {
            font-size: 10px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .inverter .on { color: var(--text-on); }
        .inverter .off { color: var(--text-off); }
        .inverter .sun { color: var(--text-sun); }
        .inverter .night { color: var(--text-night); }
        .inverter .muted { color: var(--text-secondary); }

        /* krem: where the house's power comes from right now */
        .hub { display: flex; flex-direction: column; align-items: center; }
        .hub-row { display: flex; align-items: center; width: 100%; }
        .hub-node {
            background: var(--hub-node-bg);
            border-radius: 12px;
            padding: 7px 8px;
            text-align: center;
            box-sizing: border-box;
            min-width: 80px;
        }
        .hub-row .hub-node { width: 80px; flex: none; }
        .hub svg { display: block; margin: 0 auto 2px; }
        .hub-node svg { width: 18px; height: 18px; }
        .hub-value { font-size: 15px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .hub-label { font-size: 10px; letter-spacing: 0.3px; text-transform: uppercase; color: var(--text-secondary); }
        .hub-flow { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .hub-home {
            width: 96px;
            height: 96px;
            flex: none;
            border-radius: 50%;
            border: 2px solid var(--divider);
            background: var(--hub-node-bg);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hub-home svg { width: 22px; height: 22px; }
        .hub-home .hub-value { font-size: 18px; }
        .hub-home.src-grid { border-color: var(--text-on); }
        .hub-home.src-battery { border-color: var(--text-off); }
        .hub-home.src-sun { border-color: var(--text-sun); }
        /* Today in the diagram's top corners: what the grid gave so far on its side, and what the panels
           gave against the day's forecast on the other. */
        #inverter { position: relative; }
        .day-total { position: absolute; top: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .day-total.grid-side { left: 12px; }
        .day-total.sun-side { right: 12px; text-align: right; }
        .day-total-value { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
        .day-total-label { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
        /* A link is grey and arrowless while nothing flows; its colour and arrow say what does and where. */
        .hub-link { flex: 1; display: flex; align-items: center; color: var(--divider); }
        .hub-link .line { flex: 1; height: 2px; background: currentColor; }
        .hub-link svg { width: 8px; height: 12px; flex: none; margin: 0; display: none; }
        .hub-link.to-home svg.to-home, .hub-link.to-side svg.to-side { display: block; }
        .hub-vline { display: flex; flex-direction: column; align-items: center; height: 20px; color: var(--divider); }
        .hub-vline .line { width: 2px; flex: 1; background: currentColor; }
        .hub-vline svg { width: 12px; height: 8px; margin: 0; display: none; }
        .hub-vline.to-home svg { display: block; }
        @media (prefers-reduced-motion: reduce) {
            .hour.changed, .card { animation: none !important; }
        }

        .inverter-footer {
            display: flex;
            justify-content: space-between;
            margin-top: var(--spacing-lg);
            padding: 0 4px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .batteries-stats { display: grid; gap: var(--spacing-xs); text-align: center; }
        .battery { display: flex; flex-direction: column; justify-content: center; }
        .battery + .battery { border-left: 1px solid var(--divider); }
        .battery.stale { opacity: 0.5; }
        .battery-flow { font-size: 12px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .battery-flow:empty { display: none; }

        /* krem, the owner only: deye-reserve's TOU table, a range a row: the hours, the target SOC as a bar and
           a number, and the bolt where it charges from the grid. */
        .tou-status { font-size: 13px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }
        .tou-status.written { color: var(--text-on); }
        .tou-status.pending { color: var(--text-warn); }
        .tou-status.failed { color: var(--text-off); }
        .tou-rows {
            display: grid;
            grid-template-columns: minmax(3.4em, max-content) 1fr 2.6em 14px;
            align-items: center;
            column-gap: var(--spacing-md);
            row-gap: 10px;
        }
        .tou-time { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
        .tou-bar { height: 6px; border-radius: 3px; background: var(--hub-node-bg); overflow: hidden; }
        .tou-bar > div { height: 100%; border-radius: 3px; background: var(--text-secondary); opacity: 0.6; }
        .tou-bar.charge > div { background: var(--text-on); opacity: 1; }
        .tou-soc { font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
        .tou-bolt { display: flex; color: var(--text-on); }
        .tou-bolt svg { width: 14px; height: 14px; }
        .tou-time.now, .tou-soc.now { color: var(--accent); }
        .tou-time.now { font-weight: 700; }
        .tou-note { font-size: 13px; line-height: 1.4; color: var(--text-warn); margin-bottom: var(--spacing-md); }
        .tou-why {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--divider);
            font-size: 12px;
            line-height: 1.45;
            color: var(--text-secondary);
        }
        .tou-why-at { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; }

        /* After deye-reserve warned that the battery will not last, until the grid is back: until when it
           lasts at the present load. */
        .battery-left {
            margin-top: var(--spacing-md);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            background: rgba(255, 69, 58, 0.15);
            color: var(--text-off);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .inverter-time { color: var(--text-primary); font-weight: 500; }
        .inverter.stale .hub { opacity: 0.5; }
        .inverter.stale .inverter-time { color: var(--text-warn); }

        .hidden { display: none !important; }

        /* Telegram Desktop opens the mini app about 600px tall: tighten the spacing so the status card
           and today's schedule fit without scrolling. The diagram keeps its size. */
        @media (max-height: 720px) {
            body { padding: var(--spacing-md); }
            .container { gap: var(--spacing-sm); }
            .card { padding: var(--spacing-md); }
            .status-badge { padding: 6px var(--spacing-md); margin-bottom: 0; }
            .status-row { padding-bottom: var(--spacing-sm); }
            .power-now { padding: var(--spacing-sm); }
            .power-title { font-size: 22px; }
            .info-row { padding: 7px 0; }
            .inverter { padding: var(--spacing-sm) 8px 8px; }
            .inverter-footer { margin-top: var(--spacing-md); font-size: 12px; }
            .schedule-header { padding-bottom: var(--spacing-sm); margin-bottom: var(--spacing-sm); }
            .schedule-footer { margin-top: var(--spacing-sm); padding-top: var(--spacing-sm); }
            .stat-value { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="statusCard">
            <div class="status-row" id="statusRow">
                <div class="status-badge" id="statusBadge">
                    <span class="status-indicator"></span>
                    <span id="statusText"></span>
                </div>
                <div class="power hidden" id="power">
                    <div class="power-now">
                        <div class="power-head">
                            <div class="power-title"><span class="status-indicator"></span><span id="powerTitle"></span></div>
                            <span class="power-tag hidden" id="powerTag"></span>
                        </div>
                        <div class="power-since" id="powerSince"></div>
                    </div>
                </div>
            </div>
            <div class="info-list">
                <div class="info-row hidden" id="reasonRow">
                    <span class="info-label" data-i18n="reason"></span>
                    <span class="info-value" id="reasonText">-</span>
                </div>
                <div class="info-row hidden" id="startRow">
                    <span class="info-label" data-i18n="start"></span>
                    <span class="info-value" id="startTime">-</span>
                </div>
                <div class="info-row hidden" id="restorationRow">
                    <span class="info-label" data-i18n="restoration"></span>
                    <span class="info-value" id="restorationTime">-</span>
                </div>
                <div class="info-row" id="updatedRow">
                    <span class="info-label" data-i18n="lastUpdated"></span>
                    <span class="info-value" id="updatedTime">-</span>
                </div>
            </div>
            <div class="inverter hidden" id="batteries">
                <div class="batteries-stats" id="batteriesStats"></div>
            </div>
            <div class="inverter hidden" id="inverter">
                <div class="day-total grid-side hidden" id="gridDay">
                    <div class="day-total-value" id="gridDayValue"></div>
                    <div class="day-total-label" id="gridDayLabel"></div>
                </div>
                <div class="day-total sun-side hidden" id="sunDay">
                    <div class="day-total-value" id="sunDayValue"></div>
                    <div class="day-total-label" id="sunDayLabel"></div>
                </div>
                <div class="hub">
                    <div class="hub-node" id="hubSun">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <div class="hub-value"></div>
                        <div class="hub-label" data-i18n="solar"></div>
                    </div>
                    <div class="hub-vline" id="hubSunLink"><div class="line"></div><svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 5 6 5-6"/></svg></div>
                    <div class="hub-row">
                        <div class="hub-node" id="hubGrid">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg>
                            <div class="hub-value"></div>
                            <div class="hub-label" data-i18n="grid"></div>
                        </div>
                        <div class="hub-link" id="hubGridLink"><div class="line"></div><svg class="to-home" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 5-6 5"/></svg></div>
                        <div class="hub-home" id="hubHome">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg>
                            <div class="hub-value"></div>
                            <div class="hub-label" data-i18n="home"></div>
                        </div>
                        <div class="hub-link" id="hubBatteryLink"><svg class="to-home" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 1 1 6l6 5"/></svg><div class="line"></div><svg class="to-side" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 5-6 5"/></svg></div>
                        <div class="hub-node" id="hubBattery">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10v4"/></svg>
                            <div class="hub-value"></div>
                            <div class="hub-flow" id="hubBatteryFlow"></div>
                        </div>
                    </div>
                </div>
                <div class="battery-left hidden" id="batteryLeft"></div>
                <div class="inverter-footer">
                    <span data-i18n="inverter"></span>
                    <span class="inverter-time" id="inverterTime">-</span>
                </div>
            </div>
        </div>

        <div class="card notice hidden" id="noticeCard"></div>
        <div class="card notice muted hidden" id="staleCard"></div>

        <div class="card hidden" id="noScheduleCard">
            <div class="empty-state" data-i18n="noSchedule"></div>
        </div>

        <div id="days"></div>

        <div class="card hidden" id="touCard">
            <div class="schedule-header">
                <span class="schedule-title" data-i18n="touTitle"></span>
                <span class="tou-status" id="touStatus"></span>
            </div>
            <div id="touBody"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (() => {
        'use strict';

        const API_ENDPOINT = '/api/v1/schedule';
        const REFRESH_INTERVAL = 10000;
        // The owner's TOU table: the server checks Telegram's signed initData; it changes at most every few minutes.
        const TOU_ENDPOINT = '/api/v1/reserve/table';
        const TOU_REFRESH = 30000;

        const $ = id => document.getElementById(id);

        const i18n = {
            en: {
                loading: 'Loading...',
                error: 'Error',
                emergencyOutage: 'Emergency outage',
                plannedOutage: 'Planned outage',
                otherOutage: 'Outage',
                scheduleOutage: 'Outage by schedule',
                possibleOutage: 'Possible outage',
                schedulePowerOn: 'Power on by schedule',
                powerOn: 'Power on',
                powerIsOn: 'Power is on',
                powerIsOff: 'No power',
                since: 'since',
                expectedSchedule: 'Scheduled outage',
                expectedMaybe: 'Possible scheduled outage',
                expectedDtek: 'DTEK: outage',
                until: 'until',
                dueBack: 'Due back by schedule at',
                asScheduled: 'As scheduled',
                backEarly: 'back early',
                notOffYet: 'not off yet',
                runningLate: 'running late',
                unscheduled: 'unscheduled',
                notAsScheduled: 'not as scheduled',
                reason: 'Reason',
                start: 'Start',
                restoration: 'Restoration',
                lastUpdated: 'DTEK data last updated',
                today: '📅 Today',
                tomorrow: '📅 Tomorrow',
                line: 'Line',
                power: 'Power',
                outages: 'Outages',
                noSchedule: 'Schedule not published',
                suspended: '⚠️ Hourly schedules don\'t apply right now, the restoration time may change.',
                multiLine: 'The house is fed by two lines; DTEK doesn\'t know which one feeds a given flat.',
                noGroup: 'DTEK has no schedule group for this address.',
                voluntary: 'Ask the building management for the outage schedule.',
                otherOperator: 'Power at this address is managed by another operator.',
                stale: 'Data may be outdated, last successful update',
                reserve: 'The home server is off: a backup in the cloud reads DTEK every 5 minutes, last at',
                loadError: '⚠️ Load error',
                grid: 'Grid',
                gridOn: 'On',
                gridOff: 'Off',
                battery: 'Battery',
                solar: 'Solar',
                kwh: 'kWh',
                sunOf: 'of',
                kwhToday: 'today',
                night: 'night',
                day: 'day',
                sunForecast: 'forecast',
                inverter: 'Last data update',
                watt: 'W',
                kilowatt: 'kW',
                home: 'Home',
                elevator: 'Elevator',
                water: 'Water',
                batteryLeft: 'At the present load the battery lasts until',
                touTitle: '🔋 TOU table',
                touWritten: '✓ in the inverter',
                touOff: 'recommendation only',
                touPending: 'not in the inverter yet',
                touFailed: 'not written',
                touToday: 'Today',
                touTomorrow: 'Tomorrow',
                touBoth: 'Today and tomorrow',
                touFrom: 'from',
                touCharge: 'charge from the grid',
                touSafe: 'Safe table 90/45',
                touKept: 'Plan of',
                touStale: 'The plan has not been updated since',
                touNone: 'No plan for today'
            },
            uk: {
                loading: 'Завантаження...',
                error: 'Помилка',
                emergencyOutage: 'Аварійне відключення',
                plannedOutage: 'Планове відключення',
                otherOutage: 'Відключення',
                scheduleOutage: 'Відключення за графіком',
                possibleOutage: 'Можливе відключення',
                schedulePowerOn: 'За графіком світло має бути',
                powerOn: 'Світло є',
                powerIsOn: 'Світло є',
                powerIsOff: 'Світла немає',
                since: 'з',
                expectedSchedule: 'За графіком — відключення',
                expectedMaybe: 'За графіком — можливе відключення',
                expectedDtek: 'ДТЕК: відключення',
                until: 'до',
                dueBack: 'За графіком світло мало бути з',
                asScheduled: 'За графіком',
                backEarly: 'увімкнули раніше',
                notOffYet: 'ще не вимкнули',
                runningLate: 'затримується',
                unscheduled: 'поза графіком',
                notAsScheduled: 'не за графіком',
                reason: 'Причина',
                start: 'Початок',
                restoration: 'Відновлення',
                lastUpdated: 'Дані ДТЕК від',
                today: '📅 Сьогодні',
                tomorrow: '📅 Завтра',
                line: 'Лінія',
                power: 'Зі світлом',
                outages: 'Відключення',
                noSchedule: 'Графік не опубліковано',
                suspended: '⚠️ Графіки погодинних відключень зараз не діють, час відновлення може змінюватися.',
                multiLine: 'Будинок живлять дві лінії, ДТЕК не знає, яка саме живить конкретну квартиру.',
                noGroup: 'Для цієї адреси у ДТЕК немає черги відключень.',
                voluntary: 'Графік відключень уточнюйте в ОСББ/ЖЕК/керуючій компанії.',
                otherOperator: 'Електропостачання за цією адресою забезпечує інша компанія.',
                stale: 'Дані можуть бути застарілими, останнє оновлення',
                reserve: 'Домашній сервер вимкнено: резерв у хмарі зчитує ДТЕК кожні 5 хвилин, востаннє о',
                loadError: '⚠️ Помилка',
                grid: 'Мережа',
                gridOn: 'Є',
                gridOff: 'Немає',
                battery: 'Батарея',
                solar: 'Сонце',
                kwh: 'кВт·год',
                sunOf: 'з',
                kwhToday: 'сьогодні',
                night: 'ніч',
                day: 'день',
                sunForecast: 'прогноз',
                inverter: 'Останнє оновлення інформації',
                watt: 'Вт',
                kilowatt: 'кВт',
                home: 'Дім',
                elevator: 'Ліфт',
                water: 'Вода',
                batteryLeft: 'При поточному споживанні заряду вистачить до',
                touTitle: '🔋 Таблиця TOU',
                touWritten: '✓ в інверторі',
                touOff: 'лише рекомендація',
                touPending: 'ще не в інверторі',
                touFailed: 'не записано',
                touToday: 'Сьогодні',
                touTomorrow: 'Завтра',
                touBoth: 'Сьогодні і завтра',
                touFrom: 'з',
                touCharge: 'заряд від мережі',
                touSafe: 'Безпечна таблиця 90/45',
                touKept: 'План від',
                touStale: 'План не оновлювався з',
                touNone: 'Плану на сьогодні немає'
            }
        };

        const state = {
            tg: window.Telegram?.WebApp,
            lang: 'en',
            daysKey: null,
            datesSeen: new Set(),
            slotsSeen: {},          // "date|line" → slots as last shown, to flash the hours that change
            isFirst: true,
            touAt: 0,               // when the TOU table was last asked for
            touKey: null,
            touDenied: false        // not the owner (or no table here): not asked again
        };

        const t = key => i18n[state.lang]?.[key] ?? i18n.en[key] ?? key;

        const formatDuration = mins => {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            const suffix = state.lang === 'uk' ? ['г', 'хв'] : ['h', 'm'];
            return m ? `${h}${suffix[0]} ${m}${suffix[1]}` : `${h}${suffix[0]}`;
        };

        const showToast = (msg, type) => {
            const el = $('toast');
            el.textContent = msg;
            el.className = `toast ${type} show`;
            setTimeout(() => el.classList.remove('show'), 2500);
        };

        const haptic = type => {
            try { state.tg?.HapticFeedback?.notificationOccurred(type); } catch {}
        };

        const el = (tag, cls, text) => {
            const node = document.createElement(tag);
            if (cls) node.className = cls;
            if (text !== undefined) node.textContent = text;
            return node;
        };

        const updateLabels = () => {
            document.querySelectorAll('[data-i18n]').forEach(node => {
                node.textContent = t(node.dataset.i18n);
            });
        };

        const STATUS_CLASS = {
            power_on: 'on',
            power_off: 'off',
            power_off_first_30: 'half-first',
            power_off_second_30: 'half-second'
        };

        const renderGrid = (slots, isToday, before) => {
            const grid = el('div', 'schedule-grid');
            const hour = new Date().getHours();
            slots.forEach((status, h) => {
                const current = isToday && h === hour ? ' current' : '';
                const changed = before && before[h] !== status ? ' changed' : '';
                grid.appendChild(el('div', `hour ${STATUS_CLASS[status] || 'on'}${current}${changed}`, String(h)));
            });
            return grid;
        };

        const renderStats = slots => {
            let on = 0, off = 0;
            slots.forEach(s => {
                if (s === 'power_on') on += 60;
                else if (s === 'power_off') off += 60;
                else { on += 30; off += 30; }
            });
            const footer = el('div', 'schedule-footer');
            const stats = el('div', 'stats');
            [[on, 'on', 'power'], [off, 'off', 'outages']].forEach(([mins, cls, label]) => {
                const stat = el('div', 'stat');
                stat.appendChild(el('div', `stat-value ${cls}`, formatDuration(mins)));
                stat.appendChild(el('div', 'stat-label', t(label)));
                stats.appendChild(stat);
            });
            footer.appendChild(stats);
            return footer;
        };

        const renderDay = day => {
            const card = el('div', 'card');
            const header = el('div', 'schedule-header');
            header.appendChild(el('span', 'schedule-title', t(day.is_today ? 'today' : 'tomorrow')));
            header.appendChild(el('span', 'schedule-date', day.label));
            card.appendChild(header);

            const hasOutages = day.lines.some(line => line.slots.some(s => s !== 'power_on'));
            // A tomorrow without outages is how DTEK shows "not published yet".
            if (!hasOutages && !day.is_today) {
                card.appendChild(el('div', 'empty-state', t('noSchedule')));
                return card;
            }
            const multi = day.lines.length > 1;
            day.lines.forEach((line, i) => {
                if (multi) card.appendChild(el('div', 'line-title', `${t('line')} ${i + 1} · ${line.name}`));
                card.appendChild(renderGrid(line.slots, day.is_today, state.slotsSeen[`${day.date}|${i}`]));
                if (!multi) card.appendChild(renderStats(line.slots));
            });
            return card;
        };

        // DTEK's region site doesn't post the "no power at your address" notice,
        // so without one the krem badge follows the schedule instead.
        const SCHEDULE_STATUS_SOURCES = ['krem'];

        const currentStatus = data => {
            const outage = data.outage;
            if (outage || !SCHEDULE_STATUS_SOURCES.includes(data.source)) {
                const kind = outage ? outage.kind : null;
                return {
                    badge: { emergency: 'emergency', planned: 'planned', other: 'off' }[kind] || 'on',
                    label: { emergency: 'emergencyOutage', planned: 'plannedOutage', other: 'otherOutage' }[kind] || 'powerOn',
                    reason: outage && outage.reason,
                    start: outage && outage.start,
                    end: outage && outage.end
                };
            }
            const scheduled = data.scheduled_status;
            if (!scheduled) return null;
            return {
                badge: { off: 'off', maybe: 'planned' }[scheduled.state] || 'on',
                label: { off: 'scheduleOutage', maybe: 'possibleOutage' }[scheduled.state] || 'schedulePowerOn',
                start: scheduled.start,
                end: scheduled.end
            };
        };

        const EXPECTED_OFF = {
            schedule: 'expectedSchedule', emergency: 'emergencyOutage', planned: 'plannedOutage', dtek: 'expectedDtek'
        };
        const VERDICT_TAG = {
            early: 'backEarly', not_yet: 'notOffYet', late: 'runningLate', unscheduled: 'unscheduled', differs: 'notAsScheduled'
        };

        // DTEK's side in the headline: "Scheduled outage until 12:30", "As scheduled" for power on as it should be,
        // "Power on by schedule" against an outage, or for one running past its end "Due back by schedule at 12:30".
        const expectedText = power => {
            const expected = power.expected;
            if (expected.state === 'on') {
                if (power.verdict === 'late' && power.due) return `${t('dueBack')} ${power.due}`;
                return t(power.verdict === 'agree' ? 'asScheduled' : 'schedulePowerOn');
            }
            const what = t(expected.state === 'maybe' ? 'expectedMaybe' : EXPECTED_OFF[expected.kind] || 'expectedDtek');
            return expected.until ? `${what} ${t('until')} ${expected.until}` : what;
        };

        // data.power: the server's view of the source's own sensor against DTEK's notice or schedule.
        const renderPower = power => {
            $('power').className = `power ${power.state}`;
            $('powerTitle').textContent = t(power.state === 'on' ? 'powerIsOn' : 'powerIsOff');
            const tag = power.expected && VERDICT_TAG[power.verdict];
            $('powerTag').classList.toggle('hidden', !tag);
            $('powerTag').textContent = tag ? t(tag) : '';

            // "Since 16:46 · scheduled outage until 20:00": a phrase after the time starts lower case, unless
            // it starts with a name ("DTEK: outage"). The building's inverters give no time, DTEK's side alone.
            let expected = power.expected ? expectedText(power) : '';
            if (power.since && /^.\p{Ll}/u.test(expected)) {
                expected = expected.charAt(0).toLowerCase() + expected.slice(1);
            }
            const since = power.since && `${t('since')} ${power.since}`;
            const line = [since, expected].filter(Boolean).join(' · ');
            $('powerSince').classList.toggle('hidden', !line);
            $('powerSince').textContent = line.charAt(0).toUpperCase() + line.slice(1);
        };

        const renderStatus = (status, updated, power) => {
            $('statusRow').classList.toggle('hidden', !status && !power);
            $('statusBadge').classList.toggle('hidden', !!power);
            $('power').classList.toggle('hidden', !power);
            if (power) {
                renderPower(power);
            } else if (status) {
                $('statusBadge').className = `status-badge ${status.badge}`;
                $('statusText').textContent = t(status.label);
            }

            const detail = (rowId, valueId, value) => {
                $(rowId).classList.toggle('hidden', !value);
                if (value) $(valueId).textContent = value;
            };
            detail('reasonRow', 'reasonText', status && status.reason);
            detail('startRow', 'startTime', status && status.start);
            detail('restorationRow', 'restorationTime', status && status.end);
            $('updatedTime').textContent = updated || '-';
        };

        const formatPower = watts => {
            const abs = Math.abs(watts);
            return abs < 1000 ? `${Math.round(abs)} ${t('watt')}` : `${(abs / 1000).toFixed(1)} ${t('kilowatt')}`;
        };

        // Below this the flow is noise: a battery or grid this close to zero counts as idle.
        const IDLE_W = 50;

        const kwh = v => (v >= 10 ? v.toFixed(0) : v.toFixed(1));

        // The diagram's top-left corner: what the grid gave today, the cheap night first, then the day
        // ("2.1 / 5.5", "night / day"); the total alone ("7.6", "kWh today") until the split is known.
        const renderGridDay = (done, night, day) => {
            $('gridDay').classList.toggle('hidden', done == null);
            if (done == null) return;
            const split = night != null && day != null;
            $('gridDayValue').innerHTML = split
                ? `<span class="night">${kwh(night)}</span> / <span class="on">${kwh(day)}</span>`
                : `<span class="on">${kwh(done)}</span>`;
            $('gridDayLabel').textContent = split ? `${t('night')} / ${t('day')}` : `${t('kwh')} ${t('kwhToday')}`;
        };

        // The top-right one: what the panels gave today against deye-reserve's forecast for the
        // whole day ("1.7 of 3.8", "kWh today"); either half alone when the other is missing.
        const renderSunDay = (done, forecast) => {
            const hasDone = done != null, hasForecast = forecast != null && forecast > 0;
            $('sunDay').classList.toggle('hidden', !hasDone && !hasForecast);
            const value = $('sunDayValue');
            if (hasDone && hasForecast) {
                value.innerHTML = `<span class="sun">${kwh(done)}</span> ${t('sunOf')} ${kwh(forecast)}`;
            } else if (hasDone) {
                value.innerHTML = `<span class="sun">${kwh(done)}</span>`;
            } else if (hasForecast) {
                value.textContent = `≈${kwh(forecast)}`;
            }
            $('sunDayLabel').textContent = `${t('kwh')} ${hasDone ? t('kwhToday') : t('sunForecast')}`;
        };

        // Only the source the inverter belongs to (krem) gets data.inverter: the house in the middle,
        // sun above, grid and battery at the sides, links coloured and arrowed by what flows where.
        const renderInverter = inv => {
            $('inverter').classList.toggle('hidden', !inv);
            if (!inv) return;
            $('inverter').classList.toggle('stale', inv.stale);
            const node = (id, text, cls) => {
                const value = $(id).querySelector('.hub-value');
                value.textContent = text;
                value.className = cls ? `hub-value ${cls}` : 'hub-value';
                $(id).querySelector('svg').setAttribute('class', cls || '');
            };
            const watts = w => (w == null ? '–' : formatPower(w));

            const fromGrid = inv.grid_present && inv.grid_w >= IDLE_W ? inv.grid_w : 0;
            const fromSun = inv.pv_w >= IDLE_W ? inv.pv_w : 0;
            const flow = inv.battery_w || 0;
            const fromBattery = flow <= -IDLE_W ? -flow : 0;
            const charging = flow >= IDLE_W;

            node('hubGrid', !inv.grid_present ? t('gridOff') : fromGrid ? formatPower(fromGrid) : t('gridOn'),
                inv.grid_present ? 'on' : 'off');
            $('hubGridLink').className = fromGrid ? 'hub-link to-home on' : 'hub-link';
            renderGridDay(inv.grid_today_kwh, inv.grid_night_kwh, inv.grid_day_kwh);

            node('hubSun', watts(inv.pv_w), fromSun ? 'sun' : 'muted');
            $('hubSunLink').className = fromSun ? 'hub-vline to-home sun' : 'hub-vline';
            renderSunDay(inv.pv_today_kwh, inv.pv_forecast_kwh);

            const batteryCls = fromBattery ? 'off' : charging ? 'on' : '';
            node('hubBattery', inv.soc == null ? '–' : `${Math.round(inv.soc)}%`, '');
            $('hubBattery').querySelector('svg').setAttribute('class', batteryCls);
            const batteryFlow = $('hubBatteryFlow');
            batteryFlow.textContent = batteryCls ? `${flow > 0 ? '+' : '−'}${formatPower(flow)}` : t('battery');
            batteryFlow.className = batteryCls ? `hub-flow ${batteryCls}` : 'hub-label';
            $('hubBatteryLink').className = fromBattery ? 'hub-link to-home off' : charging ? 'hub-link to-side on' : 'hub-link';

            $('batteryLeft').classList.toggle('hidden', !inv.battery_until);
            if (inv.battery_until) $('batteryLeft').textContent = `🪫 ${t('batteryLeft')} ${inv.battery_until}`;

            node('hubHome', watts(inv.load_w), '');
            const main = Math.max(fromGrid, fromSun, fromBattery);
            const ring = !main ? '' : main === fromBattery ? ' src-battery' : main === fromSun ? ' src-sun' : ' src-grid';
            $('hubHome').className = 'hub-home' + ring;
            $('inverterTime').textContent = inv.time;
        };

        const BATTERY_ICONS = {
            home: '<path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/>',
            elevator: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 9 3-3 3 3M9 15l3 3 3-3"/>',
            water: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'
        };
        const BATTERY_ICON = '<rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10v4"/>';

        // Batteries shown with this source: the home one from HA, the building's from Deye.
        const renderBatteries = rows => {
            $('batteries').classList.toggle('hidden', !rows.length);
            const stats = $('batteriesStats');
            stats.style.gridTemplateColumns = `repeat(${rows.length || 1}, minmax(0, 1fr))`;
            stats.replaceChildren(...rows.map(row => {
                const value = el('div', 'inverter-value');
                value.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
                    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    (BATTERY_ICONS[row.name] || BATTERY_ICON) + '</svg>';
                value.appendChild(el('span', '', row.soc == null ? '–' : `${Math.round(row.soc)}%`));
                const w = row.battery_w || 0;
                const flow = Math.abs(w) < IDLE_W ? ''
                    : `${w > 0 ? '+' : '−'}${(Math.abs(w) / 1000).toFixed(1)} ${t('kilowatt')}`;
                const column = el('div', row.stale ? 'battery stale' : 'battery');
                column.append(value, el('div', `battery-flow ${w > 0 ? 'on' : 'off'}`, flow), el('div', 'inverter-label', t(row.name)));
                return column;
            }));
        };

        const BOLT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
            'stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg>';

        // "07" on whole hours, "16:45" when a table has a quarter-hour charge; the day's end is 24.
        const touTime = (minute, whole) => {
            const h = String(Math.floor(minute / 60)).padStart(2, '0');
            return whole ? h : `${h}:${String(minute % 60).padStart(2, '0')}`;
        };

        // deye-reserve's table, as the server merged it: a row per range (23–07 runs past midnight), the
        // one the inverter is in now in the accent colour; tomorrow's too when it differs, with when it starts.
        const renderTou = data => {
            const body = [];
            if (data.fallback) {
                const lead = data.kept_from ? `${t('touKept')} ${data.kept_from}` : t('touSafe');
                body.push(el('div', 'tou-note', `⚠️ ${lead}: ${data.fallback}`));
            }
            if (data.stale) body.push(el('div', 'tou-note', `⚠️ ${t('touStale')} ${data.at}`));
            data.blocks.forEach(block => {
                const title = { today: 'touToday', tomorrow: 'touTomorrow', both: 'touBoth' }[block.kind];
                const from = block.from ? ` · ${t('touFrom')} ${block.from}` : '';
                body.push(el('div', 'line-title', `${t(title)}, ${block.dates}${from}`));
                const whole = block.ranges.every(r => r.start % 60 === 0 && r.end % 60 === 0);
                const rows = el('div', 'tou-rows');
                block.ranges.forEach(r => {
                    const cls = `${r.now ? ' now' : ''}${r.charge ? ' charge' : ''}`;
                    const bar = el('div', `tou-bar${cls}`);
                    const fill = el('div');
                    fill.style.width = `${r.soc}%`;
                    bar.appendChild(fill);
                    const bolt = el('div', `tou-bolt${cls}`);
                    if (r.charge) {
                        bolt.innerHTML = BOLT;
                        bolt.title = t('touCharge');
                    }
                    rows.append(el('div', `tou-time${cls}`, `${touTime(r.start, whole)}–${touTime(r.end, whole)}`),
                        bar, el('div', `tou-soc${cls}`, `${r.soc}%`), bolt);
                });
                body.push(rows);
            });
            if (!data.blocks.length) body.push(el('div', 'empty-state', t('touNone')));
            if (data.why) {
                const why = el('div', 'tou-why');
                why.append(el('span', 'tou-why-at', data.why.at), data.why.reasons.join('; '));
                body.push(why);
            }
            $('touBody').replaceChildren(...body);
            const status = { written: 'touWritten', off: 'touOff', pending: 'touPending', failed: 'touFailed' }[data.status];
            $('touStatus').textContent = status ? t(status) : '';
            $('touStatus').className = `tou-status ${data.status || ''}`;
            $('touCard').classList.remove('hidden');
        };

        // Asked for only inside Telegram, with its signed initData; anyone but the owner gets 403 once and the
        // page stays as it was. A failed refresh keeps the table shown.
        const fetchTou = async () => {
            const initData = state.tg?.initData;
            if (!initData || state.touDenied || Date.now() - state.touAt < TOU_REFRESH) return;
            state.touAt = Date.now();
            try {
                const res = await fetch(`${TOU_ENDPOINT}?_t=${Date.now()}`, { headers: { 'X-Telegram-Init-Data': initData } });
                if (res.status === 403 || res.status === 404) {
                    state.touDenied = true;
                    $('touCard').classList.add('hidden');
                    return;
                }
                if (!res.ok) return;
                const data = await res.json();
                const key = `${state.lang}|${JSON.stringify(data)}`;
                if (key !== state.touKey) {
                    state.touKey = key;
                    renderTou(data);
                }
            } catch (err) {
                console.error('TOU fetch error:', err);
            }
        };

        const renderNotices = data => {
            const notes = [];
            if (data.schedules_suspended) notes.push(t('suspended'));
            const availability = { no_group: 'noGroup', voluntary: 'voluntary', cek: 'otherOperator' }[data.availability];
            if (availability) notes.push(t(availability));
            if ((data.days || []).some(d => d.lines.length > 1)) notes.push(t('multiLine'));
            $('noticeCard').textContent = notes.join(' ');
            $('noticeCard').classList.toggle('hidden', !notes.length);

            // `reserve`: the page and its data come from the reserve on Cloudflare while the home server is away.
            const stale = !data.healthy && data.updated_at;
            const locale = state.lang === 'uk' ? 'uk-UA' : 'en-GB';
            if (stale) {
                const when = new Date(data.updated_at).toLocaleString(locale,
                    { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
                $('staleCard').textContent = `${t('stale')}: ${when}`;
            } else if (data.reserve && data.updated_at) {
                const when = new Date(data.updated_at).toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
                $('staleCard').textContent = `${t('reserve')} ${when}`;
            }
            $('staleCard').classList.toggle('hidden', !stale && !(data.reserve && data.updated_at));
        };

        const fetchData = async () => {
            try {
                const res = await fetch(`${API_ENDPOINT}?_t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                state.lang = data.lang || 'en';
                document.documentElement.lang = state.lang;
                updateLabels();

                renderStatus(currentStatus(data), data.outage_updated, data.power);
                renderNotices(data);
                renderInverter(data.inverter);
                renderBatteries(data.batteries || []);
                if (data.inverter) fetchTou();

                // Rebuilt only when the schedule or the highlighted hour changes, and then without the
                // card fade-in: replacing the cards on every 10 s refresh made them jump up each time.
                const daysKey = `${JSON.stringify(data.days || [])}|${new Date().getHours()}`;
                if (daysKey !== state.daysKey) {
                    const first = state.daysKey === null;
                    const cards = (data.days || []).map(day => {
                        const card = renderDay(day);
                        // A known day keeps still (its changed hours flash); a new one only fades in in place.
                        if (!first) card.classList.add(state.datesSeen.has(day.date) ? 'no-anim' : 'fade-in');
                        return card;
                    });
                    $('days').replaceChildren(...cards);
                    state.daysKey = daysKey;
                    (data.days || []).forEach(day => {
                        state.datesSeen.add(day.date);
                        day.lines.forEach((line, i) => { state.slotsSeen[`${day.date}|${i}`] = line.slots; });
                    });
                }
                $('noScheduleCard').classList.toggle('hidden', (data.days || []).length > 0 || data.schedules_suspended);

                state.isFirst = false;
            } catch (err) {
                console.error('Fetch error:', err);
                showToast(t('loadError'), 'error');
                haptic('error');
                if (state.isFirst) {
                    $('statusRow').classList.remove('hidden');
                    $('statusText').textContent = t('error');
                }
            }
        };

        // Light or dark by the background actually painted: Telegram's theme colours when inside it,
        // the dark fallbacks in a plain browser (where WebApp.colorScheme still says "light").
        const applyScheme = () => {
            const [r, g, b] = (getComputedStyle(document.body).backgroundColor.match(/\d+/g) || [0, 0, 0]).map(Number);
            document.documentElement.classList.toggle('light', 0.299 * r + 0.587 * g + 0.114 * b > 150);
        };

        const init = () => {
            applyScheme();
            if (state.tg) {
                state.tg.onEvent?.('themeChanged', applyScheme);
                state.tg.ready();
                state.tg.expand();
                state.tg.setHeaderColor?.('secondary_bg_color');
                state.tg.setBackgroundColor?.('secondary_bg_color');
            }
            updateLabels();
            $('statusText').textContent = t('loading');
            fetchData();
            setInterval(fetchData, REFRESH_INTERVAL);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
