<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="color-scheme" content="dark light">
    <title>DTEK Status</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=8.0"></script>
    <style>
        :root {
            --app-bg: var(--tg-theme-bg-color, #1c1c1e);
            --card-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
            --text-primary: var(--tg-theme-text-color, #fff);
            --text-secondary: var(--tg-theme-hint-color, #98989f);
            --accent: var(--tg-theme-button-color, #0a84ff);
            --accent-text: var(--tg-theme-button-text-color, #fff);
            --divider: rgba(84, 84, 88, 0.35);
            --status-on: #30d158;
            --status-off: #ff453a;
            --power-on: #5ab56a;
            --power-off: #d06058;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --transition: 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--app-bg);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            padding: var(--spacing-lg);
            padding-bottom: calc(var(--spacing-lg) + env(safe-area-inset-bottom, 0));
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card.no-anim { animation: none; }

        /* Schedule updates: a new day fades in where it stands, changed hours flash; nothing moves. */
        .card.fade-in { animation: fadeOnly 0.4s ease; }
        @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
        .hour.changed { animation: cellFlash 1.6s ease-out; }
        @keyframes cellFlash {
            from { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95); }
            to { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .status-badge.on {
            background: rgba(48, 209, 88, 0.15);
            color: var(--status-on);
        }

        .status-badge.off {
            background: rgba(255, 69, 58, 0.15);
            color: var(--status-off);
        }

        .status-badge.emergency {
            background: rgba(255, 69, 58, 0.2);
            color: var(--status-off);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-row {
            display: flex;
            justify-content: center;
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--divider);
        }

        .status-row.hidden { display: none; }

        .info-list {
            display: flex;
            flex-direction: column;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid var(--divider);
        }

        .info-row:last-child { border-bottom: none; }

        .info-label {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
        }

        .info-value {
            font-size: 15px;
            font-weight: 500;
            text-align: right;
        }

        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--divider);
            margin-bottom: var(--spacing-md);
        }

        .schedule-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .schedule-date {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
        }

        .hour {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .hour.on { background: var(--power-on); color: #fff; }
        .hour.off { background: var(--power-off); color: #fff; }
        .hour.half-first { background: linear-gradient(180deg, var(--power-off) 50%, var(--power-on) 50%); color: #fff; }
        .hour.half-second { background: linear-gradient(180deg, var(--power-on) 50%, var(--power-off) 50%); color: #fff; }

        .hour.current {
            transform: scale(1.1);
            box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .schedule-footer {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--divider);
        }

        .stats {
            display: flex;
            justify-content: space-around;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-value.on { color: var(--power-on); }
        .stat-value.off { color: var(--power-off); }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: var(--spacing-lg) 0;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: calc(80px + env(safe-area-inset-bottom, 0));
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            color: #fff;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error { background: rgba(255, 69, 58, 0.9); }

        .skeleton {
            background: linear-gradient(90deg, var(--divider) 25%, transparent 50%, var(--divider) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .status-badge.planned {
            background: rgba(255, 159, 10, 0.15);
            color: #ff9f0a;
        }

        .notice {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-primary);
            border-left: 3px solid #ff9f0a;
        }

        .notice.muted {
            color: var(--text-secondary);
            border-left-color: var(--divider);
        }

        .line-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: var(--spacing-md) 0 var(--spacing-sm);
        }

        .line-title:first-child { margin-top: 0; }

        #days {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .inverter {
            margin-top: var(--spacing-sm);
            background: rgba(127, 127, 127, 0.12);
            border-radius: var(--radius-md);
            padding: var(--spacing-md) 10px 10px;
        }

        .inverter-value {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .inverter-value svg { width: 14px; height: 14px; flex: none; }

        .inverter-label {
            font-size: 10px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .inverter .on { color: var(--power-on); }
        .inverter .off { color: var(--status-off); }
        .inverter .sun { color: #ffd60a; }
        .inverter .muted { color: var(--text-secondary); }

        /* krem: where the house's power comes from right now */
        .hub { display: flex; flex-direction: column; align-items: center; }
        .hub-row { display: flex; align-items: center; width: 100%; }
        .hub-node {
            background: rgba(127, 127, 127, 0.14);
            border-radius: 12px;
            padding: 7px 8px;
            text-align: center;
            box-sizing: border-box;
            min-width: 80px;
        }
        .hub-row .hub-node { width: 80px; flex: none; }
        .hub svg { display: block; margin: 0 auto 2px; }
        .hub-node svg { width: 18px; height: 18px; }
        .hub-value { font-size: 15px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .hub-label { font-size: 10px; letter-spacing: 0.3px; text-transform: uppercase; color: var(--text-secondary); }
        .hub-flow { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .hub-home {
            width: 96px;
            height: 96px;
            flex: none;
            border-radius: 50%;
            border: 2px solid var(--divider);
            background: rgba(127, 127, 127, 0.14);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hub-home svg { width: 22px; height: 22px; }
        .hub-home .hub-value { font-size: 18px; }
        .hub-home.src-grid { border-color: var(--power-on); }
        .hub-home.src-battery { border-color: var(--status-off); }
        .hub-home.src-sun { border-color: #ffd60a; }
        /* A link is grey and arrowless while nothing flows; its colour and arrow say what does and where. */
        .hub-link { flex: 1; display: flex; align-items: center; color: var(--divider); }
        .hub-link .line { flex: 1; height: 2px; background: currentColor; }
        .hub-link svg { width: 8px; height: 12px; flex: none; margin: 0; display: none; }
        .hub-link.to-home svg.to-home, .hub-link.to-side svg.to-side { display: block; }
        .hub-vline { display: flex; flex-direction: column; align-items: center; height: 20px; color: var(--divider); }
        .hub-vline .line { width: 2px; flex: 1; background: currentColor; }
        .hub-vline svg { width: 12px; height: 8px; margin: 0; display: none; }
        .hub-vline.to-home svg { display: block; }
        @media (prefers-reduced-motion: reduce) {
            .hour.changed, .card { animation: none !important; }
        }

        .inverter-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding: var(--spacing-sm) 4px 0;
            border-top: 1px solid var(--divider);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .batteries-stats { display: grid; gap: var(--spacing-xs); text-align: center; }
        .battery { display: flex; flex-direction: column; justify-content: center; }
        .battery + .battery { border-left: 1px solid var(--divider); }
        .battery.stale { opacity: 0.5; }
        .battery-flow { font-size: 12px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .battery-flow:empty { display: none; }

        .inverter-time { color: var(--text-primary); font-weight: 500; }
        .inverter.stale .hub { opacity: 0.5; }
        .inverter.stale .inverter-time { color: #ff9f0a; }

        .hidden { display: none !important; }

        /* Telegram Desktop opens the mini app about 600px tall: tighten the spacing so the status card
           and today's schedule fit without scrolling. The diagram keeps its size. */
        @media (max-height: 720px) {
            body { padding: var(--spacing-md); }
            .container { gap: var(--spacing-sm); }
            .card { padding: var(--spacing-md); }
            .status-badge { padding: 6px var(--spacing-md); margin-bottom: 0; }
            .status-row { padding-bottom: var(--spacing-sm); }
            .info-row { padding: 7px 0; }
            .inverter { padding: var(--spacing-sm) 8px 8px; }
            .inverter-footer { margin-top: 6px; padding-top: 6px; font-size: 12px; }
            .schedule-header { padding-bottom: var(--spacing-sm); margin-bottom: var(--spacing-sm); }
            .schedule-footer { margin-top: var(--spacing-sm); padding-top: var(--spacing-sm); }
            .stat-value { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="statusCard">
            <div class="status-row" id="statusRow">
                <div class="status-badge" id="statusBadge">
                    <span class="status-indicator"></span>
                    <span id="statusText"></span>
                </div>
            </div>
            <div class="info-list">
                <div class="info-row hidden" id="reasonRow">
                    <span class="info-label" data-i18n="reason"></span>
                    <span class="info-value" id="reasonText">-</span>
                </div>
                <div class="info-row hidden" id="startRow">
                    <span class="info-label" data-i18n="start"></span>
                    <span class="info-value" id="startTime">-</span>
                </div>
                <div class="info-row hidden" id="restorationRow">
                    <span class="info-label" data-i18n="restoration"></span>
                    <span class="info-value" id="restorationTime">-</span>
                </div>
                <div class="info-row" id="updatedRow">
                    <span class="info-label" data-i18n="lastUpdated"></span>
                    <span class="info-value" id="updatedTime">-</span>
                </div>
            </div>
            <div class="inverter hidden" id="batteries">
                <div class="batteries-stats" id="batteriesStats"></div>
            </div>
            <div class="inverter hidden" id="inverter">
                <div class="hub">
                    <div class="hub-node" id="hubSun">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <div class="hub-value"></div>
                        <div class="hub-label" data-i18n="solar"></div>
                    </div>
                    <div class="hub-vline" id="hubSunLink"><div class="line"></div><svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 5 6 5-6"/></svg></div>
                    <div class="hub-row">
                        <div class="hub-node" id="hubGrid">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg>
                            <div class="hub-value"></div>
                            <div class="hub-label" data-i18n="grid"></div>
                        </div>
                        <div class="hub-link" id="hubGridLink"><div class="line"></div><svg class="to-home" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 5-6 5"/></svg></div>
                        <div class="hub-home" id="hubHome">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg>
                            <div class="hub-value"></div>
                            <div class="hub-label" data-i18n="home"></div>
                        </div>
                        <div class="hub-link" id="hubBatteryLink"><svg class="to-home" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 1 1 6l6 5"/></svg><div class="line"></div><svg class="to-side" viewBox="0 0 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 5-6 5"/></svg></div>
                        <div class="hub-node" id="hubBattery">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10v4"/></svg>
                            <div class="hub-value"></div>
                            <div class="hub-flow" id="hubBatteryFlow"></div>
                        </div>
                    </div>
                </div>
                <div class="inverter-footer">
                    <span data-i18n="inverter"></span>
                    <span class="inverter-time" id="inverterTime">-</span>
                </div>
            </div>
        </div>

        <div class="card notice hidden" id="noticeCard"></div>
        <div class="card notice muted hidden" id="staleCard"></div>

        <div class="card hidden" id="noScheduleCard">
            <div class="empty-state" data-i18n="noSchedule"></div>
        </div>

        <div id="days"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (() => {
        'use strict';

        const API_ENDPOINT = '/api/v1/schedule';
        const REFRESH_INTERVAL = 10000;

        const $ = id => document.getElementById(id);

        const i18n = {
            en: {
                loading: 'Loading...',
                error: 'Error',
                emergencyOutage: 'Emergency outage',
                plannedOutage: 'Planned outage',
                otherOutage: 'Outage',
                scheduleOutage: 'Outage by schedule',
                possibleOutage: 'Possible outage',
                schedulePowerOn: 'Power on by schedule',
                powerOn: 'Power on',
                reason: 'Reason',
                start: 'Start',
                restoration: 'Restoration',
                lastUpdated: 'Last updated',
                today: '📅 Today',
                tomorrow: '📅 Tomorrow',
                line: 'Line',
                power: 'Power',
                outages: 'Outages',
                noSchedule: 'Schedule not published',
                suspended: '⚠️ Hourly schedules don\'t apply right now, the restoration time may change.',
                multiLine: 'The house is fed by two lines; DTEK doesn\'t know which one feeds a given flat.',
                noGroup: 'DTEK has no schedule group for this address.',
                voluntary: 'Ask the building management for the outage schedule.',
                otherOperator: 'Power at this address is managed by another operator.',
                stale: 'Data may be outdated, last successful update',
                loadError: '⚠️ Load error',
                grid: 'Grid',
                gridOn: 'On',
                gridOff: 'Off',
                battery: 'Battery',
                solar: 'Solar',
                inverter: 'Last data update',
                watt: 'W',
                kilowatt: 'kW',
                home: 'Home',
                elevator: 'Elevator',
                water: 'Water'
            },
            uk: {
                loading: 'Завантаження...',
                error: 'Помилка',
                emergencyOutage: 'Аварійне відключення',
                plannedOutage: 'Планове відключення',
                otherOutage: 'Відключення',
                scheduleOutage: 'Відключення за графіком',
                possibleOutage: 'Можливе відключення',
                schedulePowerOn: 'За графіком світло має бути',
                powerOn: 'Світло є',
                reason: 'Причина',
                start: 'Початок',
                restoration: 'Відновлення',
                lastUpdated: 'Дані ДТЕК від',
                today: '📅 Сьогодні',
                tomorrow: '📅 Завтра',
                line: 'Лінія',
                power: 'Зі світлом',
                outages: 'Відключення',
                noSchedule: 'Графік не опубліковано',
                suspended: '⚠️ Графіки погодинних відключень зараз не діють, час відновлення може змінюватися.',
                multiLine: 'Будинок живлять дві лінії, ДТЕК не знає, яка саме живить конкретну квартиру.',
                noGroup: 'Для цієї адреси у ДТЕК немає черги відключень.',
                voluntary: 'Графік відключень уточнюйте в ОСББ/ЖЕК/керуючій компанії.',
                otherOperator: 'Електропостачання за цією адресою забезпечує інша компанія.',
                stale: 'Дані можуть бути застарілими, останнє оновлення',
                loadError: '⚠️ Помилка',
                grid: 'Мережа',
                gridOn: 'Є',
                gridOff: 'Немає',
                battery: 'Батарея',
                solar: 'Сонце',
                inverter: 'Останнє оновлення інформації',
                watt: 'Вт',
                kilowatt: 'кВт',
                home: 'Дім',
                elevator: 'Ліфт',
                water: 'Вода'
            }
        };

        const state = {
            tg: window.Telegram?.WebApp,
            lang: 'en',
            daysKey: null,
            datesSeen: new Set(),
            slotsSeen: {},          // "date|line" → slots as last shown, to flash the hours that change
            isFirst: true
        };

        const t = key => i18n[state.lang]?.[key] ?? i18n.en[key] ?? key;

        const formatDuration = mins => {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            const suffix = state.lang === 'uk' ? ['г', 'хв'] : ['h', 'm'];
            return m ? `${h}${suffix[0]} ${m}${suffix[1]}` : `${h}${suffix[0]}`;
        };

        const showToast = (msg, type) => {
            const el = $('toast');
            el.textContent = msg;
            el.className = `toast ${type} show`;
            setTimeout(() => el.classList.remove('show'), 2500);
        };

        const haptic = type => {
            try { state.tg?.HapticFeedback?.notificationOccurred(type); } catch {}
        };

        const el = (tag, cls, text) => {
            const node = document.createElement(tag);
            if (cls) node.className = cls;
            if (text !== undefined) node.textContent = text;
            return node;
        };

        const updateLabels = () => {
            document.querySelectorAll('[data-i18n]').forEach(node => {
                node.textContent = t(node.dataset.i18n);
            });
        };

        const STATUS_CLASS = {
            power_on: 'on',
            power_off: 'off',
            power_off_first_30: 'half-first',
            power_off_second_30: 'half-second'
        };

        const renderGrid = (slots, isToday, before) => {
            const grid = el('div', 'schedule-grid');
            const hour = new Date().getHours();
            slots.forEach((status, h) => {
                const current = isToday && h === hour ? ' current' : '';
                const changed = before && before[h] !== status ? ' changed' : '';
                grid.appendChild(el('div', `hour ${STATUS_CLASS[status] || 'on'}${current}${changed}`, String(h)));
            });
            return grid;
        };

        const renderStats = slots => {
            let on = 0, off = 0;
            slots.forEach(s => {
                if (s === 'power_on') on += 60;
                else if (s === 'power_off') off += 60;
                else { on += 30; off += 30; }
            });
            const footer = el('div', 'schedule-footer');
            const stats = el('div', 'stats');
            [[on, 'on', 'power'], [off, 'off', 'outages']].forEach(([mins, cls, label]) => {
                const stat = el('div', 'stat');
                stat.appendChild(el('div', `stat-value ${cls}`, formatDuration(mins)));
                stat.appendChild(el('div', 'stat-label', t(label)));
                stats.appendChild(stat);
            });
            footer.appendChild(stats);
            return footer;
        };

        const renderDay = day => {
            const card = el('div', 'card');
            const header = el('div', 'schedule-header');
            header.appendChild(el('span', 'schedule-title', t(day.is_today ? 'today' : 'tomorrow')));
            header.appendChild(el('span', 'schedule-date', day.label));
            card.appendChild(header);

            const hasOutages = day.lines.some(line => line.slots.some(s => s !== 'power_on'));
            // A tomorrow without outages is how DTEK shows "not published yet".
            if (!hasOutages && !day.is_today) {
                card.appendChild(el('div', 'empty-state', t('noSchedule')));
                return card;
            }
            const multi = day.lines.length > 1;
            day.lines.forEach((line, i) => {
                if (multi) card.appendChild(el('div', 'line-title', `${t('line')} ${i + 1} · ${line.name}`));
                card.appendChild(renderGrid(line.slots, day.is_today, state.slotsSeen[`${day.date}|${i}`]));
                if (!multi) card.appendChild(renderStats(line.slots));
            });
            return card;
        };

        // DTEK's region site doesn't post the "no power at your address" notice,
        // so without one the krem badge follows the schedule instead.
        const SCHEDULE_STATUS_SOURCES = ['krem'];

        const currentStatus = data => {
            const outage = data.outage;
            if (outage || !SCHEDULE_STATUS_SOURCES.includes(data.source)) {
                const kind = outage ? outage.kind : null;
                return {
                    badge: { emergency: 'emergency', planned: 'planned', other: 'off' }[kind] || 'on',
                    label: { emergency: 'emergencyOutage', planned: 'plannedOutage', other: 'otherOutage' }[kind] || 'powerOn',
                    reason: outage && outage.reason,
                    start: outage && outage.start,
                    end: outage && outage.end
                };
            }
            const scheduled = data.scheduled_status;
            if (!scheduled) return null;
            return {
                badge: { off: 'off', maybe: 'planned' }[scheduled.state] || 'on',
                label: { off: 'scheduleOutage', maybe: 'possibleOutage' }[scheduled.state] || 'schedulePowerOn',
                start: scheduled.start,
                end: scheduled.end
            };
        };

        const renderStatus = (status, updated) => {
            $('statusRow').classList.toggle('hidden', !status);
            if (status) {
                $('statusBadge').className = `status-badge ${status.badge}`;
                $('statusText').textContent = t(status.label);
            }

            const detail = (rowId, valueId, value) => {
                $(rowId).classList.toggle('hidden', !value);
                if (value) $(valueId).textContent = value;
            };
            detail('reasonRow', 'reasonText', status && status.reason);
            detail('startRow', 'startTime', status && status.start);
            detail('restorationRow', 'restorationTime', status && status.end);
            $('updatedTime').textContent = updated || '-';
        };

        const formatPower = watts => {
            const abs = Math.abs(watts);
            return abs < 1000 ? `${Math.round(abs)} ${t('watt')}` : `${(abs / 1000).toFixed(1)} ${t('kilowatt')}`;
        };

        // Below this the flow is noise: a battery or grid this close to zero counts as idle.
        const IDLE_W = 50;

        // Only the source the inverter belongs to (krem) gets data.inverter: the house in the middle,
        // sun above, grid and battery at the sides, links coloured and arrowed by what flows where.
        const renderInverter = inv => {
            $('inverter').classList.toggle('hidden', !inv);
            if (!inv) return;
            $('inverter').classList.toggle('stale', inv.stale);
            const node = (id, text, cls) => {
                const value = $(id).querySelector('.hub-value');
                value.textContent = text;
                value.className = cls ? `hub-value ${cls}` : 'hub-value';
                $(id).querySelector('svg').setAttribute('class', cls || '');
            };
            const watts = w => (w == null ? '–' : formatPower(w));

            const fromGrid = inv.grid_present && inv.grid_w >= IDLE_W ? inv.grid_w : 0;
            const fromSun = inv.pv_w >= IDLE_W ? inv.pv_w : 0;
            const flow = inv.battery_w || 0;
            const fromBattery = flow <= -IDLE_W ? -flow : 0;
            const charging = flow >= IDLE_W;

            node('hubGrid', !inv.grid_present ? t('gridOff') : fromGrid ? formatPower(fromGrid) : t('gridOn'),
                inv.grid_present ? 'on' : 'off');
            $('hubGridLink').className = fromGrid ? 'hub-link to-home on' : 'hub-link';

            node('hubSun', watts(inv.pv_w), fromSun ? 'sun' : 'muted');
            $('hubSunLink').className = fromSun ? 'hub-vline to-home sun' : 'hub-vline';

            const batteryCls = fromBattery ? 'off' : charging ? 'on' : '';
            node('hubBattery', inv.soc == null ? '–' : `${Math.round(inv.soc)}%`, '');
            $('hubBattery').querySelector('svg').setAttribute('class', batteryCls);
            const batteryFlow = $('hubBatteryFlow');
            batteryFlow.textContent = batteryCls ? `${flow > 0 ? '+' : '−'}${formatPower(flow)}` : t('battery');
            batteryFlow.className = batteryCls ? `hub-flow ${batteryCls}` : 'hub-label';
            $('hubBatteryLink').className = fromBattery ? 'hub-link to-home off' : charging ? 'hub-link to-side on' : 'hub-link';

            node('hubHome', watts(inv.load_w), '');
            const main = Math.max(fromGrid, fromSun, fromBattery);
            const ring = !main ? '' : main === fromBattery ? ' src-battery' : main === fromSun ? ' src-sun' : ' src-grid';
            $('hubHome').className = 'hub-home' + ring;
            $('inverterTime').textContent = inv.time;
        };

        const BATTERY_ICONS = {
            home: '<path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/>',
            elevator: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 9 3-3 3 3M9 15l3 3 3-3"/>',
            water: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'
        };
        const BATTERY_ICON = '<rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10v4"/>';

        // Batteries shown with this source: the home one from HA, the building's from Deye.
        const renderBatteries = rows => {
            $('batteries').classList.toggle('hidden', !rows.length);
            const stats = $('batteriesStats');
            stats.style.gridTemplateColumns = `repeat(${rows.length || 1}, minmax(0, 1fr))`;
            stats.replaceChildren(...rows.map(row => {
                const value = el('div', 'inverter-value');
                value.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
                    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    (BATTERY_ICONS[row.name] || BATTERY_ICON) + '</svg>';
                value.appendChild(el('span', '', row.soc == null ? '–' : `${Math.round(row.soc)}%`));
                const w = row.battery_w || 0;
                const flow = Math.abs(w) < IDLE_W ? ''
                    : `${w > 0 ? '+' : '−'}${(Math.abs(w) / 1000).toFixed(1)} ${t('kilowatt')}`;
                const column = el('div', row.stale ? 'battery stale' : 'battery');
                column.append(value, el('div', `battery-flow ${w > 0 ? 'on' : 'off'}`, flow), el('div', 'inverter-label', t(row.name)));
                return column;
            }));
        };

        const renderNotices = data => {
            const notes = [];
            if (data.schedules_suspended) notes.push(t('suspended'));
            const availability = { no_group: 'noGroup', voluntary: 'voluntary', cek: 'otherOperator' }[data.availability];
            if (availability) notes.push(t(availability));
            if ((data.days || []).some(d => d.lines.length > 1)) notes.push(t('multiLine'));
            $('noticeCard').textContent = notes.join(' ');
            $('noticeCard').classList.toggle('hidden', !notes.length);

            const stale = !data.healthy && data.updated_at;
            if (stale) {
                const when = new Date(data.updated_at).toLocaleString(state.lang === 'uk' ? 'uk-UA' : 'en-GB',
                    { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
                $('staleCard').textContent = `${t('stale')}: ${when}`;
            }
            $('staleCard').classList.toggle('hidden', !stale);
        };

        const fetchData = async () => {
            try {
                const res = await fetch(`${API_ENDPOINT}?_t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                state.lang = data.lang || 'en';
                document.documentElement.lang = state.lang;
                updateLabels();

                renderStatus(currentStatus(data), data.outage_updated);
                renderNotices(data);
                renderInverter(data.inverter);
                renderBatteries(data.batteries || []);

                // Rebuilt only when the schedule or the highlighted hour changes, and then without the
                // card fade-in: replacing the cards on every 10 s refresh made them jump up each time.
                const daysKey = `${JSON.stringify(data.days || [])}|${new Date().getHours()}`;
                if (daysKey !== state.daysKey) {
                    const first = state.daysKey === null;
                    const cards = (data.days || []).map(day => {
                        const card = renderDay(day);
                        // A known day keeps still (its changed hours flash); a new one only fades in in place.
                        if (!first) card.classList.add(state.datesSeen.has(day.date) ? 'no-anim' : 'fade-in');
                        return card;
                    });
                    $('days').replaceChildren(...cards);
                    state.daysKey = daysKey;
                    (data.days || []).forEach(day => {
                        state.datesSeen.add(day.date);
                        day.lines.forEach((line, i) => { state.slotsSeen[`${day.date}|${i}`] = line.slots; });
                    });
                }
                $('noScheduleCard').classList.toggle('hidden', (data.days || []).length > 0 || data.schedules_suspended);

                state.isFirst = false;
            } catch (err) {
                console.error('Fetch error:', err);
                showToast(t('loadError'), 'error');
                haptic('error');
                if (state.isFirst) {
                    $('statusRow').classList.remove('hidden');
                    $('statusText').textContent = t('error');
                }
            }
        };

        const init = () => {
            if (state.tg) {
                state.tg.ready();
                state.tg.expand();
                state.tg.setHeaderColor?.('secondary_bg_color');
                state.tg.setBackgroundColor?.('secondary_bg_color');
            }
            updateLabels();
            $('statusText').textContent = t('loading');
            fetchData();
            setInterval(fetchData, REFRESH_INTERVAL);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
