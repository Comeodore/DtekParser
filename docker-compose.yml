services:
  dtek:
    build: .
    image: dtek-service:latest
    container_name: dtek-service
    restart: unless-stopped
    # Host network: Wake-on-LAN broadcasts must reach the LAN, and the source
    # ports (9999 kem, 9998 krem) stay where the tunnel and probes expect them.
    network_mode: host
    # Reaps Chromium's child processes (python would otherwise be PID 1).
    init: true
    env_file: .env
    volumes:
      # Browser cookies per source (see tools/solve_captcha.sh).
      - ./data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  reserve:
    build:
      context: .
      dockerfile: Dockerfile.reserve
    image: deye-reserve:latest
    container_name: deye-reserve
    restart: unless-stopped
    # Host network: it reads dtek-service on 127.0.0.1:9998 and takes its webhooks on 127.0.0.1:9997.
    network_mode: host
    init: true
    env_file: .env
    volumes:
      # Token, state, forecast and load caches.
      - ./reserve-data:/app/data
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
